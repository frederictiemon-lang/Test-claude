    <script>
      // particles: built once from a seeded generator (deterministic, same every render)
      (function () {
        let seed = 20261119;
        const rnd = () => {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
        const host = document.getElementById("particles");
        window.__particles = [];
        for (let i = 0; i < 46; i++) {
          const el = document.createElement("div");
          el.className = "p";
          el.id = "p" + i;
          const size = 2 + Math.round(rnd() * 5);
          el.style.left = Math.round(40 + rnd() * 1000) + "px";
          el.style.top = Math.round(120 + rnd() * 1700) + "px";
          el.style.width = el.style.height = size + "px";
          el.style.background = rnd() < 0.45 ? "#035BF7" : "#FFFFFF";
          if (size > 5) el.style.filter = "blur(1.5px)";
          host.appendChild(el);
          window.__particles.push({ el, dy: -(80 + rnd() * 260), a: 0.25 + rnd() * 0.6, d0: rnd() * 0.9 });
        }
      })();

      const tl = gsap.timeline({ paused: true });
      const E = "power3.out";
      const EI = "power3.in";

      // ---------- particles + blue light (0 -> 5) ----------
      window.__particles.forEach(({ el, dy, a, d0 }) => {
        tl.fromTo(el, { y: 0, opacity: 0 }, { y: dy * 0.5, opacity: a, duration: 2.2, ease: "sine.out" }, d0);
        tl.to(el, { y: dy, opacity: a * 0.5, duration: 2.2, ease: "sine.inOut" }, d0 + 2.21);
      });
      tl.fromTo("#glow", { opacity: 0, scale: 0.7 }, { opacity: 0.7, scale: 1, duration: 1.4, ease: "sine.out" }, 0.1);

      // ---------- scene 1 — hook (0 -> 2.5) ----------
      tl.fromTo("#ui-input", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.55, ease: E }, 0.15);
      tl.fromTo("#ui-cursor", { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", repeat: 5, yoyo: true, repeatDelay: 0.24 }, 0.5);
      tl.fromTo("#ui-b1", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: E }, 0.55);
      tl.fromTo("#ui-b2", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: E }, 0.85);
      // VO (said "li-a", tools/make_vo1.py): "Et si l'IA" 0.33 · "devenait votre" ~0.77 · "meilleur allié ?" ~1.44 → 2.11
      tl.fromTo("#h1", { yPercent: 130 }, { yPercent: 0, duration: 0.45, ease: E }, 0.3);
      tl.fromTo("#h2", { yPercent: 130 }, { yPercent: 0, duration: 0.45, ease: E }, 0.76);
      tl.fromTo("#h3", { yPercent: 130 }, { yPercent: 0, duration: 0.45, ease: E }, 1.4);
      // out: the sketch gives way to the real app
      tl.to("#s1", { opacity: 0, y: -60, duration: 0.25, ease: EI }, 2.35);

      // ---------- scene 2 — discovery (2.5 -> 4.9) ----------
      // VO: "Découvrez" 2.66 · "une nouvelle façon de travailler" 3.27
      tl.fromTo("#d1", { yPercent: 130 }, { yPercent: 0, duration: 0.45, ease: E }, 2.6);
      tl.fromTo("#d2", { yPercent: 130 }, { yPercent: 0, duration: 0.45, ease: E }, 3.22);
      tl.fromTo("#d3", { yPercent: 130 }, { yPercent: 0, duration: 0.45, ease: E }, 3.62);
      tl.fromTo("#phone", { y: 1500, scale: 0.92 }, { y: 0, scale: 1, duration: 0.5, ease: "power4.out" }, 2.4);
      // three screens pushed in on the beat: 2.5 · 3.25 · 4.0
      tl.fromTo("#shot-b", { x: 600 }, { x: 600, duration: 0.01, ease: "none" }, 0);
      tl.fromTo("#shot-c", { x: 600 }, { x: 600, duration: 0.01, ease: "none" }, 0);
      tl.fromTo("#cam-a", { scale: 1 }, { scale: 1.12, duration: 0.8, ease: "sine.inOut" }, 2.5);
      tl.fromTo("#ring-input", { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.25, ease: E }, 2.8);
      tl.to("#shot-a", { x: -600, duration: 0.28, ease: "power3.inOut" }, 3.12);
      tl.to("#shot-b", { x: 0, duration: 0.28, ease: "power3.inOut" }, 3.12);
      tl.fromTo("#cam-b", { scale: 1 }, { scale: 1.16, duration: 0.8, ease: "sine.inOut" }, 3.25);
      ["#ring-redac", "#ring-code", "#ring-docs"].forEach((r, i) => {
        tl.fromTo(r, { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.22, ease: E }, 3.42 + i * 0.16);
      });
      tl.to("#shot-b", { x: -600, duration: 0.28, ease: "power3.inOut" }, 3.87);
      tl.to("#shot-c", { x: 0, duration: 0.28, ease: "power3.inOut" }, 3.87);
      tl.fromTo("#cam-c", { scale: 1 }, { scale: 1.12, duration: 0.9, ease: "sine.inOut" }, 4.0);
      tl.fromTo("#ring-images", { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.22, ease: E }, 4.17);
