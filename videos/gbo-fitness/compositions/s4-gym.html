<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="../styles/brand.css" />
      <style>
        #s4-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          color: #ffffff;
        }
        #s4-stage {
          position: absolute;
          inset: 0;
          background: #000000;
        }
        #s4-chipbox {
          top: 280px;
        }
        #s4-art {
          position: absolute;
          left: 140px;
          top: 400px;
          width: 800px;
          height: 620px;
        }
        #s4-title {
          top: 1050px;
          font-size: 88px;
          font-stretch: 100%;
        }
        #s4-subbox {
          top: 1310px;
        }
      </style>
      <div id="s4-root" data-composition-id="s4-gym" data-width="1080" data-height="1920">
        <div id="s4-stage">
          <div class="center-col" id="s4-chipbox"><span class="chip" id="s4-chip">02 · Coaching en salle</span></div>
          <svg id="s4-art" viewBox="0 0 800 620" fill="none">
            <g id="s4-barbell">
              <rect x="60" y="300" width="680" height="20" rx="10" fill="#FFFFFF" />
              <rect x="110" y="200" width="46" height="220" rx="12" fill="#C6F202" />
              <rect x="166" y="230" width="36" height="160" rx="10" fill="#C6F202" />
              <rect x="212" y="270" width="18" height="80" rx="6" fill="#FFFFFF" />
              <rect x="644" y="200" width="46" height="220" rx="12" fill="#C6F202" />
              <rect x="598" y="230" width="36" height="160" rx="10" fill="#C6F202" />
              <rect x="570" y="270" width="18" height="80" rx="6" fill="#FFFFFF" />
            </g>
            <rect x="40" y="560" width="720" height="10" rx="5" fill="#FFFFFF" opacity="0.35" />
          </svg>
          <div class="center-col display" id="s4-title">
            <span class="mask"><span id="s4-t1">EN SALLE.</span></span>
            <span class="mask"><span id="s4-t2" class="lime">AVEC UN COACH.</span></span>
          </div>
          <div class="center-col" id="s4-subbox">
            <p class="sub" id="s4-sub">Progresse avec un accompagnement adapté à ton niveau.</p>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const T0 = 11.3;
          const at = (t) => t - T0;
          const tl = gsap.timeline({ paused: true });
          const E = "power3.out";
          const EI = "power3.in";
          // push in from the right (overlaps scene 3's push out)
          tl.fromTo("#s4-stage", { x: 1080, scale: 1, opacity: 1 }, { x: 0, duration: 0.32, ease: E }, at(11.3));
          tl.fromTo("#s4-chip", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: E }, at(11.55));
          // "En salle," (VO 11.64-12.16)
          tl.fromTo("#s4-t1", { yPercent: 150 }, { yPercent: 0, duration: 0.35, ease: E }, at(11.6));
          // barbell: two clean reps on the beat
          tl.fromTo("#s4-barbell", { y: 200, opacity: 0 }, { y: 120, opacity: 1, duration: 0.35, ease: E }, at(11.5));
          tl.to("#s4-barbell", { y: -60, duration: 0.45, ease: "power2.out" }, at(12.0));
          tl.to("#s4-barbell", { y: 120, duration: 0.45, ease: "power2.in" }, at(12.5));
          tl.to("#s4-barbell", { y: -60, duration: 0.45, ease: "power2.out" }, at(13.0));
          tl.to("#s4-barbell", { y: 40, duration: 0.35, ease: "power2.inOut" }, at(13.45));
          // "progresse avec un coach" (VO 12.26-13.76)
          tl.fromTo("#s4-t2", { yPercent: 150 }, { yPercent: 0, duration: 0.35, ease: E }, at(12.25));
          tl.fromTo("#s4-sub", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, at(12.5));
          // punch-through into the montage
          tl.to("#s4-stage", { scale: 1.25, opacity: 0, duration: 0.2, ease: EI }, at(13.82));
          window.__timelines["s4-gym"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
