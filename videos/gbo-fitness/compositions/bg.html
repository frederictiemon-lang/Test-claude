<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #bg-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #000000;
        }
        #bg-lines {
          position: absolute;
          left: -600px;
          top: -400px;
          width: 2400px;
          height: 2800px;
          background: repeating-linear-gradient(-62deg, rgba(198, 242, 2, 0.07) 0 3px, transparent 3px 120px);
        }
        #bg-vignette {
          position: absolute;
          inset: 0;
          background: radial-gradient(ellipse at 50% 45%, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, 0.85) 100%);
        }
      </style>
      <div id="bg-root" data-composition-id="bg" data-width="1080" data-height="1920">
        <div id="bg-lines" data-layout-allow-overflow></div>
        <div id="bg-vignette"></div>
      </div>
      <script>
        (() => {
        const tl = gsap.timeline({ paused: true });
        // slow diagonal drift for depth, across the whole spot
        tl.fromTo("#bg-lines", { x: 0, y: 0 }, { x: -240, y: 120, duration: 30, ease: "none" }, 0);
        window.__timelines["bg"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
