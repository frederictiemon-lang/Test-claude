<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="../styles/brand.css" />
      <style>
        #s2-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          color: #ffffff;
        }
        #s2-flash {
          position: absolute;
          inset: 0;
          background: var(--lime);
        }
        /* official logo, shown at its native 1280x462 ratio */
        #s2-logo-wrap {
          position: absolute;
          left: 90px;
          top: 380px;
          width: 900px;
          height: 325px;
        }
        #s2-logo {
          display: block;
          width: 900px;
          height: 325px;
        }
        #s2-name {
          top: 780px;
          font-size: 112px;
        }
        #s2-rule {
          width: 640px;
          height: 6px;
          margin-top: 48px;
          background: var(--lime);
          transform-origin: 50% 50%;
        }
        #s2-tag {
          top: 760px;
          font-size: 74px;
        }
        #s2-wipe {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 1920px;
          background: var(--lime);
        }
      </style>
      <div id="s2-root" data-composition-id="s2-brand" data-width="1080" data-height="1920">
        <div id="s2-flash"></div>
        <div id="s2-logo-wrap">
          <img id="s2-logo" src="../assets/logo/gbo-logo.jpg" alt="Logo GBÔ" />
        </div>
        <div class="center-col display" id="s2-name" data-layout-allow-overlap>
          <span class="mask"><span id="s2-name-in"><span class="lime">GBÔ</span> FITNESS</span></span>
          <div id="s2-rule"></div>
        </div>
        <div class="center-col display" id="s2-tag" data-layout-allow-overlap>
          <span class="mask"><span id="s2-t1">TON OBJECTIF.</span></span>
          <span class="mask"><span id="s2-t2">NOTRE</span></span>
          <span class="mask"><span id="s2-t3">ACCOMPAGNEMENT.</span></span>
          <span class="mask"><span id="s2-t4" class="lime">TON ÉVOLUTION.</span></span>
        </div>
        <div id="s2-wipe" data-layout-allow-occlusion></div>
      </div>
      <script>
        (() => {
          // Times are written in spot time and shifted to scene time.
          const T0 = 3;
          const at = (t) => t - T0;
          const tl = gsap.timeline({ paused: true });
          const E = "power3.out";
          const EI = "power3.in";
          tl.fromTo("#s2-flash", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.out" }, at(3.0));
          // logo opens from its centre line, then settles (downscale only: stays sharp)
          tl.fromTo(
            "#s2-logo-wrap",
            { clipPath: "inset(0% 50% 0% 50%)", y: 0 },
            { clipPath: "inset(-10% -10% -10% -10%)", duration: 0.7, ease: "expo.out" },
            at(3.1)
          );
          tl.fromTo("#s2-logo", { scale: 1.08 }, { scale: 1, duration: 1.4, ease: "power2.out" }, at(3.1));
          // "GBÔ FITNESS" (VO 3.19-4.45)
          tl.fromTo("#s2-name-in", { yPercent: 150 }, { yPercent: 0, duration: 0.45, ease: E }, at(3.45));
          tl.fromTo("#s2-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power4.out" }, at(3.75));
          tl.to("#s2-name-in", { yPercent: -150, duration: 0.3, ease: EI }, at(4.35));
          tl.to("#s2-rule", { scaleX: 0, duration: 0.25, ease: EI }, at(4.35));
          tl.to("#s2-logo-wrap", { y: -130, duration: 0.6, ease: "power2.inOut" }, at(4.35));
          // promise, line by line with the voice (4.67 / 5.55 / 6.4)
          tl.fromTo("#s2-t1", { yPercent: 150 }, { yPercent: 0, duration: 0.4, ease: E }, at(4.65));
          tl.fromTo("#s2-t2", { yPercent: 150 }, { yPercent: 0, duration: 0.4, ease: E }, at(5.5));
          tl.fromTo("#s2-t3", { yPercent: 150 }, { yPercent: 0, duration: 0.4, ease: E }, at(5.65));
          tl.fromTo("#s2-t4", { yPercent: 150 }, { yPercent: 0, duration: 0.45, ease: E }, at(6.35));
          // lime wipe hands off to scene 3
          tl.fromTo("#s2-wipe", { yPercent: 100 }, { yPercent: 0, duration: 0.25, ease: "power3.in" }, at(7.25));
          window.__timelines["s2-brand"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
