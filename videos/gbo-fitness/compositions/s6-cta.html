  <body>
    <template>
      <link rel="stylesheet" href="../styles/brand.css" />
      <style>
        #s6-root {
          position: absolute;

          color: #ffffff;
        }
        /* official logo, native 1280x462 ratio */
        #s6-logo-wrap {
          position: absolute;

          height: 274px;
        }
        #s6-logo {
          display: block;
          width: 760px;
          height: 274px;
        }
        #s6-rule {
          position: absolute;
          left: 300px;
          top: 528px;
          width: 480px;
          height: 6px;
          background: var(--lime);
          transform-origin: 50% 50%;
        }
        #s6-name {
          top: 560px;
          font-size: 96px;
        }
        #s6-promise {
          top: 668px;
          font-family: "Manrope", sans-serif;
          font-weight: 800;
          font-size: 44px;
          letter-spacing: 0.04em;
          color: var(--lime);
        }
        #s6-services {
          top: 750px;
          font-family: "Manrope", sans-serif;
          font-weight: 700;
          font-size: 33px;
          letter-spacing: 0.05em;
          color: var(--white);
        }
        #s6-city {
          top: 808px;
          font-size: 60px;
          color: var(--lime);
        }
        #s6-book {
          position: absolute;
          left: 120px;
          top: 930px;
          width: 840px;
          height: 510px;
          border: 5px solid var(--lime);
          border-radius: 36px;
          overflow: hidden;
          background: #050505;
        }
        #s6-book-head {
          height: 118px;
          display: flex;
          align-items: center;
          justify-content: center;
          background: var(--lime);
          color: var(--black);
          font-family: "GBO Display", sans-serif;
          font-weight: 900;
          font-stretch: 100%;
          font-size: 50px;
          text-transform: uppercase;
        }
        .s6-num-row {
          position: absolute;
          left: 0;
          width: 830px;
          height: 170px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #s6-num1 {
          top: 135px;
        }
        #s6-num2 {
          top: 305px;
        }
        .s6-num {
          font-family: "GBO Display", sans-serif;
          font-weight: 800;
          font-stretch: 100%;
          font-size: 112px;
          letter-spacing: 0.02em;
          color: var(--white);
          font-variant-numeric: tabular-nums;
        }
        .s6-mark {
          position: absolute;
          left: 215px;
          top: 154px;
          width: 400px;
          height: 6px;
          border-radius: 3px;
          background: var(--lime);
          transform-origin: 50% 50%;
        }
      </style>
      <div id="s6-root" data-composition-id="s6-cta" data-width="1080" data-height="1920">
        <div id="s6-logo-wrap">
          <img id="s6-logo" src="../assets/logo/gbo-logo.jpg" alt="Logo GBÔ" />
        </div>
        <div id="s6-rule"></div>
        <div class="center-col display" id="s6-name">
          <span class="mask"><span id="s6-name-in"><span class="lime">GBÔ</span> FITNESS</span></span>
        </div>
        <div class="center-col" id="s6-promise"><span class="mask"><span id="s6-promise-in">TON OBJECTIF COMMENCE ICI.</span></span></div>
        <div class="center-col" id="s6-services"><span class="mask"><span id="s6-services-in">COACHING À DOMICILE • EN SALLE DE SPORT</span></span></div>
        <div class="center-col display" id="s6-city"><span class="mask"><span id="s6-city-in">PARTOUT À ABIDJAN</span></span></div>
        <div id="s6-book">
          <div id="s6-book-head">Réservez votre séance</div>
          <div class="s6-num-row" id="s6-num1">
            <div class="s6-mark" id="s6-mark1"></div>
            <span class="s6-num" id="s6-num1-t">0748414803</span>
          </div>
          <div class="s6-num-row" id="s6-num2">
            <div class="s6-mark" id="s6-mark2"></div>
            <span class="s6-num" id="s6-num2-t">01 03161415</span>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const T0 = 18;
          const at = (t) => t - T0;
          const tl = gsap.timeline({ paused: true });
          const E = "power3.out";
          const EI = "power3.in";
          // "GBÔ FITNESS !" (VO 18.36-19.66)
          tl.fromTo("#s6-logo-wrap", { clipPath: "inset(0% 50% 0% 50%)" }, { clipPath: "inset(-10% -10% -10% -10%)", duration: 0.6, ease: "expo.out" }, at(18.05));
          tl.fromTo("#s6-logo", { scale: 1.06 }, { scale: 1, duration: 1.2, ease: "power2.out" }, at(18.05));
          tl.fromTo("#s6-name-in", { yPercent: 150 }, { yPercent: 0, duration: 0.4, ease: E }, at(18.3));
          tl.fromTo("#s6-promise-in", { yPercent: 150 }, { yPercent: 0, duration: 0.4, ease: E }, at(18.9));
          tl.fromTo("#s6-services-in", { yPercent: 150 }, { yPercent: 0, duration: 0.4, ease: E }, at(19.3));
          tl.fromTo("#s6-city-in", { yPercent: 150 }, { yPercent: 0, duration: 0.4, ease: E }, at(19.6));
          // booking block: both numbers land together (before the voice reads them) and never move again
          tl.fromTo("#s6-book", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, at(20.25));
          // reading guides follow the voice — underlines below the digits, nothing covers them
          // (VO: first number ~20.9-24.8, second ~25.1-27.9)
          tl.fromTo("#s6-mark1", { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: E }, at(20.9));
          tl.to("#s6-mark1", { scaleX: 0, duration: 0.2, ease: EI }, at(24.9));
          tl.fromTo("#s6-mark2", { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: E }, at(25.1));
          tl.to("#s6-mark2", { scaleX: 0, duration: 0.2, ease: EI }, at(28.0));
          // "Partout à Abidjan !" (VO 28.1-29.06)
          tl.fromTo("#s6-city", { scale: 1 }, { scale: 1.08, duration: 0.25, ease: "power2.out" }, at(28.1));
          tl.to("#s6-city", { scale: 1, duration: 0.4, ease: "power2.inOut" }, at(28.4));
          // closing hit on the logo
          tl.fromTo("#s6-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power4.out" }, at(29.0));
          tl.to("#s6-logo", { scale: 1.03, duration: 0.2, ease: "power2.out" }, at(29.0));
          tl.to("#s6-logo", { scale: 1, duration: 0.6, ease: "power2.inOut" }, at(29.2));
          window.__timelines["s6-cta"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
