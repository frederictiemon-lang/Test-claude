<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="../styles/brand.css" />
      <style>
        #s5-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #000000;
        }
        .goal-card {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          padding: 0 var(--safe-x);
          opacity: 0;
        }
        .goal-card.on-lime {
          background: var(--lime);
          color: var(--black);
        }
        .goal-card.on-black {
          background: var(--black);
          color: var(--lime);
        }
        .goal-word {
          font-size: 124px;
          font-stretch: 100%;
        }
        .goal-word.long {
          font-size: 86px;
          font-stretch: 100%;
        }
        .goal-idx {
          font-family: "Manrope", sans-serif;
          font-weight: 800;
          font-size: 40px;
          letter-spacing: 0.2em;
          margin-bottom: 40px;
        }
        #s5-progress {
          position: absolute;
          left: 240px;
          top: 1380px;
          width: 600px;
          height: 12px;
          display: flex;
          gap: 12px;
        }
        .s5-seg {
          flex: 1;
          border-radius: 6px;
          background: rgba(128, 128, 128, 0.45);
          overflow: hidden;
        }
        .s5-seg i {
          display: block;
          width: 100%;
          height: 100%;
          background: #ffffff;
          transform-origin: 0% 50%;
        }
        #s5-choose {
          position: absolute;
          inset: 0;
          background: var(--black);
          color: var(--white);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          opacity: 0;
        }
        #s5-choose .display {
          font-size: 150px;
        }
      </style>
      <div id="s5-root" data-composition-id="s5-goals" data-width="1080" data-height="1920">
        <div class="goal-card on-black" id="g1">
          <div class="goal-idx">OBJECTIF 1/4</div>
          <div class="display goal-word"><span class="mask"><span id="g1-w">PERTE<br />DE POIDS</span></span></div>
        </div>
        <div class="goal-card on-lime" id="g2">
          <div class="goal-idx">OBJECTIF 2/4</div>
          <div class="display goal-word"><span class="mask"><span id="g2-w">PRISE<br />DE MASSE</span></span></div>
        </div>
        <div class="goal-card on-black" id="g3">
          <div class="goal-idx">OBJECTIF 3/4</div>
          <div class="display goal-word"><span class="mask"><span id="g3-w">REMISE<br />EN FORME</span></span></div>
        </div>
        <div class="goal-card on-lime" id="g4">
          <div class="goal-idx">OBJECTIF 4/4</div>
          <div class="display goal-word long"><span class="mask"><span id="g4-w">RENFORCEMENT<br />MUSCULAIRE</span></span></div>
        </div>
        <div id="s5-choose">
          <div class="display"><span class="mask"><span id="s5-c1">À TOI DE</span></span></div>
          <div class="display lime"><span class="mask"><span id="s5-c2">CHOISIR.</span></span></div>
        </div>
        <div id="s5-progress">
          <div class="s5-seg"><i id="p1"></i></div>
          <div class="s5-seg"><i id="p2"></i></div>
          <div class="s5-seg"><i id="p3"></i></div>
          <div class="s5-seg"><i id="p4"></i></div>
        </div>
      </div>
      <script>
        (() => {
          const T0 = 14;
          const at = (t) => t - T0;
          const tl = gsap.timeline({ paused: true });
          // cards land on the 120 BPM grid, next to the spoken words
          // (VO: "perte de poids" 14.12, "prise de masse" 14.94, "remise en forme" 15.76)
          const cards = [
            ["#g1", "#g1-w", 14.0, "#p1"],
            ["#g2", "#g2-w", 15.0, "#p2"],
            ["#g3", "#g3-w", 15.75, "#p3"],
            ["#g4", "#g4-w", 16.5, "#p4"],
          ];
          cards.forEach(([card, word, t, bar], i) => {
            const next = i < 3 ? cards[i + 1][2] : 17.2;
            tl.fromTo(card, { opacity: 0, scale: 1.08 }, { opacity: 1, duration: 0.04, ease: "none" }, at(t));
            tl.to(card, { scale: 1, duration: next - t, ease: "power2.out" }, at(t));
            tl.fromTo(word, { yPercent: 150 }, { yPercent: 0, duration: 0.28, ease: "power4.out" }, at(t));
            tl.fromTo(bar, { scaleX: 0 }, { scaleX: 1, duration: next - t, ease: "none" }, at(t));
            tl.to(card, { opacity: 0, duration: 0.04, ease: "none" }, at(next - 0.02));
          });
          // "à toi de choisir !" (VO 16.76-17.68)
          tl.fromTo("#s5-progress", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "none" }, at(17.15));
          tl.fromTo("#s5-choose", { opacity: 0, scale: 1 }, { opacity: 1, duration: 0.04, ease: "none" }, at(17.18));
          tl.fromTo("#s5-c1", { yPercent: 150 }, { yPercent: 0, duration: 0.3, ease: "power4.out" }, at(17.2));
          tl.fromTo("#s5-c2", { yPercent: 150 }, { yPercent: 0, duration: 0.3, ease: "power4.out" }, at(17.35));
          tl.to("#s5-choose", { scale: 1.6, opacity: 0, duration: 0.22, ease: "power3.in" }, at(17.78));
          window.__timelines["s5-goals"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
