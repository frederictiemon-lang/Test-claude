    <script>
      const tl = gsap.timeline({ paused: true });
      const T1 = 0.45; // left G stops
      const T2 = 1.35; // right G stops
      const T3 = 2.15; // both together

      // ---- 1. the left G flies in from the left and stops dead: impact 1 ----
      tl.fromTo("#g-left", { x: -1350, skewX: 16 }, { x: 0, skewX: 16, duration: T1 - 0.1, ease: "power3.in" }, 0.1);
      tl.to("#g-left", { skewX: -6, scaleX: 0.9, duration: 0.05, ease: "power2.out" }, T1);
      tl.to("#g-left", { skewX: 0, scaleX: 1, duration: 0.4, ease: "elastic.out(1.1, 0.45)" }, T1 + 0.05);
      tl.set("#g-left", { filter: "saturate(0.2) brightness(2)" }, T1);
      tl.to("#g-left", { filter: "saturate(1) brightness(1)", duration: 0.25, ease: "power2.out" }, T1 + 0.01);
      tl.set("#g-left", { filter: "none" }, T1 + 0.27);
      tl.set("#ring-a", { scale: 0.3, opacity: 0.9 }, T1);
      tl.to("#ring-a", { scale: 2.6, opacity: 0, duration: 0.5, ease: "power2.out" }, T1 + 0.01);

      // ---- 2. the right G flies in from the right and stops dead: impact 2 ----
      tl.fromTo("#g-right", { x: 1350, skewX: -16 }, { x: 0, skewX: -16, duration: T2 - 1.0, ease: "power3.in" }, 1.0);
      tl.to("#g-right", { skewX: 6, scaleX: 0.9, duration: 0.05, ease: "power2.out" }, T2);
      tl.to("#g-right", { skewX: 0, scaleX: 1, duration: 0.4, ease: "elastic.out(1.1, 0.45)" }, T2 + 0.05);
      tl.set("#g-right", { filter: "saturate(0.2) brightness(2)" }, T2);
      tl.to("#g-right", { filter: "saturate(1) brightness(1)", duration: 0.25, ease: "power2.out" }, T2 + 0.01);
      tl.set("#g-right", { filter: "none" }, T2 + 0.27);
      tl.set("#ring-b", { scale: 0.3, opacity: 0.9 }, T2);
      tl.to("#ring-b", { scale: 3, opacity: 0, duration: 0.55, ease: "power2.out" }, T2 + 0.01);
      // the left G takes the hit
      tl.to("#g-left", { x: -16, duration: 0.05, ease: "power2.out" }, T2 + 0.005);
      tl.to("#g-left", { x: 0, duration: 0.2, ease: "power2.inOut" }, T2 + 0.06);

      // ---- 3. both pull back, charge, and slam together: the big impact ----
      tl.to("#g-left", { x: -80, duration: 0.4, ease: "power2.out" }, 1.62);
      tl.to("#g-right", { x: 80, duration: 0.4, ease: "power2.out" }, 1.62);
      tl.to("#punch", { scale: 0.95, duration: 0.4, ease: "power2.out" }, 1.62);
      tl.to("#g-left", { x: 0, duration: 0.1, ease: "power4.in" }, T3 - 0.1);
      tl.to("#g-right", { x: 0, duration: 0.1, ease: "power4.in" }, T3 - 0.1);
      tl.set("#punch", { scale: 1.16 }, T3);
      tl.to("#punch", { scale: 1, duration: 0.9, ease: "elastic.out(1, 0.5)" }, T3 + 0.01);
      tl.set("#glyphs", { filter: "saturate(0.2) brightness(2)" }, T3);
      tl.to("#glyphs", { filter: "saturate(1) brightness(1)", duration: 0.35, ease: "power2.out" }, T3 + 0.01);
      tl.set("#glyphs", { filter: "none" }, T3 + 0.37);
      // white flash, then two short strobes
      tl.set("#flash", { opacity: 0.85 }, T3);
      tl.to("#flash", { opacity: 0, duration: 0.18, ease: "power2.out" }, T3 + 0.01);
      tl.set("#flash", { opacity: 0.16 }, T3 + 0.4);
      tl.to("#flash", { opacity: 0, duration: 0.08, ease: "none" }, T3 + 0.41);
      tl.set("#flash", { opacity: 0.1 }, T3 + 0.55);
      tl.to("#flash", { opacity: 0, duration: 0.08, ease: "none" }, T3 + 0.56);
      // three shockwave rings
      ["#ring-c1", "#ring-c2", "#ring-c3"].forEach((r, i) => {
        tl.set(r, { scale: 0.3, opacity: 0.9 - i * 0.2 }, T3 + i * 0.08);
        tl.to(r, { scale: 5 + i, opacity: 0, duration: 0.7, ease: "power2.out" }, T3 + i * 0.08 + 0.01);
      });
      // lights appear: rays, crossing beams, horizontal flare, glow
      tl.fromTo("#rays", { opacity: 0, rotation: 0 }, { opacity: 1, rotation: 6, duration: 0.25, ease: "power2.out" }, T3);
      tl.to("#rays", { rotation: 30, duration: 1.4, ease: "none" }, T3 + 0.26);
      tl.to("#rays", { opacity: 0, duration: 0.6, ease: "power2.in" }, T3 + 1.0);
      tl.fromTo("#beam-a", { rotation: -24, y: -420, opacity: 0 }, { y: 0, opacity: 0.9, duration: 0.25, ease: "power2.out" }, T3 + 0.02);
      tl.to("#beam-a", { y: 420, opacity: 0, duration: 0.35, ease: "power2.in" }, T3 + 0.28);
      tl.fromTo("#beam-b", { rotation: 24, y: 420, opacity: 0 }, { y: 0, opacity: 0.9, duration: 0.25, ease: "power2.out" }, T3 + 0.08);
      tl.to("#beam-b", { y: -420, opacity: 0, duration: 0.35, ease: "power2.in" }, T3 + 0.34);
      tl.fromTo("#flare", { opacity: 0, scaleX: 0.1 }, { opacity: 1, scaleX: 1, duration: 0.12, ease: "power2.out" }, T3);
      tl.to("#flare", { opacity: 0, duration: 0.45, ease: "power2.in" }, T3 + 0.13);
      tl.fromTo("#bloom", { opacity: 0 }, { opacity: 0.9, duration: 0.1, ease: "power2.out" }, T3);
      tl.to("#bloom", { opacity: 0, duration: 1.5, ease: "sine.inOut" }, T3 + 0.2);

      // brouillage (glitch): white ghost + displaced slices for 12 frames
      tl.set("#ghost", { x: 15, opacity: 0.26 }, 2.1500);
      tl.set("#sl0", { x: -67, opacity: 1 }, 2.1500);
      tl.set("#sl1", { x: 26, opacity: 1 }, 2.1500);
      tl.set("#sl2", { x: 61, opacity: 1 }, 2.1500);
      tl.set("#sl3", { x: 39, opacity: 1 }, 2.1500);
      tl.set("#ghost", { x: -25, opacity: 0.41 }, 2.1833);
      tl.set("#sl0", { x: -5, opacity: 1 }, 2.1833);
      tl.set("#sl1", { x: 0, opacity: 0 }, 2.1833);
      tl.set("#sl2", { x: 0, opacity: 0 }, 2.1833);
      tl.set("#sl3", { x: 0, opacity: 0 }, 2.1833);
      tl.set("#ghost", { x: 15, opacity: 0.72 }, 2.2167);
      tl.set("#sl0", { x: 33, opacity: 1 }, 2.2167);
      tl.set("#sl1", { x: -67, opacity: 1 }, 2.2167);
      tl.set("#sl2", { x: 0, opacity: 0 }, 2.2167);
      tl.set("#sl3", { x: 64, opacity: 1 }, 2.2167);
      tl.set("#glyphs", { opacity: 0.35 }, 2.2167);
      tl.set("#ghost", { x: -13, opacity: 0.46 }, 2.2500);
      tl.set("#sl0", { x: -67, opacity: 1 }, 2.2500);
      tl.set("#sl1", { x: 0, opacity: 0 }, 2.2500);
